version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
    - misspell
    - unconvert
  settings:
    depguard:
      rules:
        # Domain modules must not import each other; cross-module needs go
        # through ports wired in internal/app. See docs/architecture/modules.md.
        auth-module:
          files: ["**/internal/auth/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/instance
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/chat
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/realtime
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/voice
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/integrations
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/jobs
              desc: modules reach the job queue through their own port (wired in internal/app)
        chat-module:
          files: ["**/internal/chat/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/instance
              desc: modules must not import each other (use ports via internal/app)
            # Glob form so internal/authctx (the shared contract) stays allowed.
            - pkg: github.com/getstoop/stoop/internal/auth{,/**}
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/realtime
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/voice
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/integrations
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/jobs
              desc: modules reach the job queue through their own port (wired in internal/app)
        instance-module:
          files: ["**/internal/instance/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/auth{,/**}
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/chat
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/realtime
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/voice
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/integrations
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/jobs
              desc: modules reach the job queue through their own port (wired in internal/app)
        realtime-module:
          files: ["**/internal/realtime/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/instance
              desc: modules must not import each other (use ports via internal/app)
            # Glob form so internal/authctx (the shared contract) stays allowed.
            - pkg: github.com/getstoop/stoop/internal/auth{,/**}
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/chat
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/voice
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/integrations
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/dbgen
              desc: the gateway has no database access; use ports
            - pkg: github.com/getstoop/stoop/internal/jobs
              desc: modules reach the job queue through their own port (wired in internal/app)
        files-module:
          files: ["**/internal/files/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/instance
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/auth{,/**}
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/chat
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/realtime
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/voice
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/integrations
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/jobs
              desc: modules reach the job queue through their own port (wired in internal/app)
        blob-package:
          files: ["**/internal/blob/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/dbgen
              desc: the blob store is storage only; metadata lives in the files module
        voice-module:
          files: ["**/internal/voice/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/instance
              desc: modules must not import each other (use ports via internal/app)
            # Glob form so internal/authctx (the shared contract) stays allowed.
            - pkg: github.com/getstoop/stoop/internal/auth{,/**}
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/chat
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/realtime
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/integrations
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/jobs
              desc: modules reach the job queue through their own port (wired in internal/app)

        integrations-module:
          files: ["**/internal/integrations/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/instance
              desc: modules must not import each other (use ports via internal/app)
            # Glob form so internal/authctx (the shared contract) stays allowed.
            - pkg: github.com/getstoop/stoop/internal/auth{,/**}
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/chat
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/realtime
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/voice
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/files
              desc: modules must not import each other (use ports via internal/app)
            - pkg: github.com/getstoop/stoop/internal/jobs
              desc: modules reach the job queue through their own port (wired in internal/app)

        jobs-module:
          files: ["**/internal/jobs/**"]
          deny:
            - pkg: github.com/getstoop/stoop/internal/auth{,/**}
              desc: the job queue imports no module (performers are registered in internal/app)
            - pkg: github.com/getstoop/stoop/internal/chat
              desc: the job queue imports no module (performers are registered in internal/app)
            - pkg: github.com/getstoop/stoop/internal/instance
              desc: the job queue imports no module (performers are registered in internal/app)
            - pkg: github.com/getstoop/stoop/internal/realtime
              desc: the job queue imports no module (performers are registered in internal/app)
            - pkg: github.com/getstoop/stoop/internal/voice
              desc: the job queue imports no module (performers are registered in internal/app)
            - pkg: github.com/getstoop/stoop/internal/files
              desc: the job queue imports no module (performers are registered in internal/app)
            - pkg: github.com/getstoop/stoop/internal/integrations
              desc: the job queue imports no module (performers are registered in internal/app)
        events-package:
          files: ["**/internal/events/**"]
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: the bus is in-process; the relay over Postgres is internal/eventrelay

formatters:
  enable:
    - gofmt
