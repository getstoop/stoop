# pnpm 11 reads its settings here, not from .npmrc. mobile/ is its own
# project with its own lockfile, not a workspace with web/: Expo pins its
# own React, and the two share source files only (web/src/gen).

# Expo's guidance for pnpm: a flat node_modules, as npm lays it out.
nodeLinker: hoisted

# A version younger than the release-age gate stops the install instead
# of pnpm quietly adding it to an exclusion list.
minimumReleaseAgeStrict: true

# Our own changes to a package, as pnpm patch writes them (patches/):
#   - expo-video-thumbnails reads a video tile's first frame (api/posters)
#     on a queue of its own on iOS, not the one every module's async
#     functions share (sharing, secure store, clipboard wait behind a
#     frame read over the network otherwise), and at most 1024 px on a
#     side, not the video's full size.
patchedDependencies:
  expo-video-thumbnails@58.0.2: patches/expo-video-thumbnails@58.0.2.patch
