appId: ${APP_ID}
name: Edit a message from its menu, cancel an edit, and see Save refuse an emptied one
---
# After channel.yaml, which needs chapters unread for ada with only dee's
# first notes in it: ada writes here, from another device (and deletes
# it again, so the seed is left as found), and alphabetical order
# carries that today; nothing later minds the edits meanwhile. As ada,
# editing her own notes in chapters.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
    timeout: 15000
# ada's own note, written from another device.
- runScript:
    file: scripts/rpc.js
    env:
      STEP: ownerSays
      CHANNEL_ID: ${CHAPTERS_ID}
      TEXT: Bring the paperback
- extendedWaitUntil:
    visible: "Bring the paperback"
    timeout: 10000
# A draft first, so there is one to set aside.
- tapOn: "Message #chapters"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
- inputText: "Half a thought"
- tapOn: "Chapter 54 notes"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
- assertVisible: "Half a thought"
# Edit message closes the sheet, rings the note and opens the card on the
# editing strip, the field holding the note's words and Save in Send's
# place, Attach dimmed. Before each long press the list settles.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Bring the paperback"
- extendedWaitUntil:
    visible: "Edit message"
    timeout: 5000
- tapOn: "Edit message"
- extendedWaitUntil:
    visible: "Editing message"
    timeout: 5000
- assertVisible:
    id: "edit-target"
- assertVisible:
    id: "composer"
    text: "Bring the paperback"
- assertVisible: "Save"
- assertVisible: "Cancel editing"
- assertVisible:
    text: "Attach files"
    enabled: false
# Cancel editing: the strip and the ring go, the note stands as it was,
# and the draft set aside is back in the field.
- tapOn: "Cancel editing"
- extendedWaitUntil:
    notVisible: "Editing message"
    timeout: 5000
- assertNotVisible:
    id: "edit-target"
- assertVisible:
    id: "composer"
    text: "Half a thought"
- assertVisible: "Send"
- eraseText: 20
- tapOn: "Chapter 54 notes"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
- assertVisible: "Message #chapters"
# Edited and saved: the note reads the new words once, marked edited,
# the strip and the ring are gone, and the server holds the new words.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Bring the paperback"
- extendedWaitUntil:
    visible: "Edit message"
    timeout: 5000
- tapOn: "Edit message"
- extendedWaitUntil:
    visible: "Editing message"
    timeout: 5000
- inputText: ", please"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Bring the paperback, please \\(edited\\)"
    timeout: 10000
- assertNotVisible:
    text: "Bring the paperback.*"
    index: 1
- assertNotVisible: "Editing message"
- assertNotVisible:
    id: "edit-target"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: contentIs
      CHANNEL_ID: ${CHAPTERS_ID}
      EXPECTED: Bring the paperback, please
- assertTrue: ${output.contentIs}
- tapOn: "Chapter 54 notes"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
# An emptied field is refused, in web's words, and the edit goes on.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Bring the paperback, please.*"
- extendedWaitUntil:
    visible: "Edit message"
    timeout: 5000
- tapOn: "Edit message"
- extendedWaitUntil:
    visible: "Editing message"
    timeout: 5000
- eraseText: 40
- tapOn: "Save"
- extendedWaitUntil:
    visible: "A message can't be empty — delete it instead."
    timeout: 5000
- assertVisible: "Editing message"
- assertVisible:
    id: "edit-target"
- tapOn: "Cancel editing"
- extendedWaitUntil:
    notVisible: "Editing message"
    timeout: 5000
- assertVisible: "Bring the paperback, please \\(edited\\)"
- tapOn: "Chapter 54 notes"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: ownerUnsays
- extendedWaitUntil:
    notVisible: "Bring the paperback.*"
    timeout: 10000
# A note mentioning dee, as a token the field shows as @dee: other words
# changed and saved, the server still holds the token.
- runScript:
    file: scripts/rpc.js
    env:
      STEP: ownerMentions
      CHANNEL_ID: ${CHAPTERS_ID}
      TEXT: has the spare copy
- extendedWaitUntil:
    visible: "@${POSTER} has the spare copy"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "@${POSTER} has the spare copy"
- extendedWaitUntil:
    visible: "Edit message"
    timeout: 5000
- tapOn: "Edit message"
- extendedWaitUntil:
    visible: "Editing message"
    timeout: 5000
- assertVisible:
    id: "composer"
    text: "@${POSTER} has the spare copy"
- inputText: " tonight"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "@${POSTER} has the spare copy tonight \\(edited\\)"
    timeout: 10000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: contentIs
      CHANNEL_ID: ${CHAPTERS_ID}
      EXPECTED: "<@u:${POSTER_ID}:${POSTER}> has the spare copy tonight"
- assertTrue: ${output.contentIs}
# The seed as found.
- runScript:
    file: scripts/rpc.js
    env:
      STEP: ownerUnsays
- extendedWaitUntil:
    notVisible: "@${POSTER} has the spare copy.*"
    timeout: 10000
