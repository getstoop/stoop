appId: ${APP_ID}
name: Swipe a conversation in Messages to Close and tap it, then swipe one all the way to close it
---
# As ada (seed.mjs), in her conversation with dee (messages.yaml). A
# short swipe left rests the row open on Close, and a tap there closes
# the conversation; a long one closes it on letting go. dee writing
# brings it back each time. What the server holds after a close is
# conversation-menu.yaml's.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn:
    id: "tab-messages"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: dmSay
      TEXT: Back from the trip
- extendedWaitUntil:
    visible: "${POSTER}, offline, unread, .*, Back from the trip"
    timeout: 15000
# Close is under the row, kept from a screen reader until it is open.
- assertNotVisible: "Close conversation"
- swipe:
    from: "${POSTER}, offline, unread, .*"
    direction: LEFT
- extendedWaitUntil:
    visible: "Close conversation"
    timeout: 5000
- assertVisible: "${POSTER}, offline, unread, .*"
- tapOn: "Close conversation"
- extendedWaitUntil:
    notVisible: "${POSTER}, offline, .*"
    timeout: 10000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: dmSay
      TEXT: Photos coming
- extendedWaitUntil:
    visible: "${POSTER}, offline, unread, .*, Photos coming"
    timeout: 15000
# All the way across, from the row's right edge, closes it on letting
# go, with no Close to tap. A swipe from the row's middle stops short,
# so this one is by the screen: the first row, under the title, on this
# simulator's layout.
- swipe:
    start: "92%, 23%"
    end: "3%, 23%"
    duration: 600
- extendedWaitUntil:
    notVisible: "${POSTER}, offline, .*"
    timeout: 10000
- assertNotVisible: "Close conversation"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: dmSay
      TEXT: Here they are
- extendedWaitUntil:
    visible: "${POSTER}, offline, unread, .*, Here they are"
    timeout: 15000
