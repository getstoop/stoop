appId: ${APP_ID}
name: See files under messages, a photo, two in a grid, a PDF, a video with its first frame, an audio file and an expired file, page through the photos full screen, play the video and the audio, and share the PDF
---
# photos (seed.mjs): dee's landscape photo, then a portrait one, the two
# together, a PDF, a short clip, ten seconds of audio, and, newest, a
# photo since expired. Each file is one element, read by its kind and
# name.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "photos"
    timeout: 15000
- tapOn: "photos"
- extendedWaitUntil:
    visible: "photos, ${SPACE}, \\d+ members"
    timeout: 15000
- extendedWaitUntil:
    visible: "Expired attachment, \\d+(\\.\\d)? KB"
    timeout: 15000
- assertVisible: "Video, ridge-walk\\.mp4, 93 KB\\. Plays full screen"
- assertVisible: "trail-notes\\.pdf, 585 B"
- assertVisible: "Image 1 of 2, ridge-landscape\\.jpg"
- assertVisible: "Image 2 of 2, hut-portrait\\.jpg"
- assertVisible: "Image, hut-portrait\\.jpg\\. Opens full screen"
- scrollUntilVisible:
    element: "Image, ridge-landscape\\.jpg\\. Opens full screen"
    direction: UP
- assertNotVisible: "📎.*"
# A long press on a photo is the row's: the menu's card draws the
# message's files small, the photo once more under the same name.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Image, ridge-landscape\\.jpg\\. Opens full screen"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- assertVisible:
    id: "attachment-strip-compact"
- tapOn:
    id: "message-menu-close"
- extendedWaitUntil:
    notVisible: "Quote in reply"
    timeout: 5000
# A tap on a photo opens it full screen, as the first of the channel's
# five pictures and videos (the expired one is none of them), read with
# who sent it; a swipe pages to the next, and Close goes back to the
# channel.
- tapOn: "Image, ridge-landscape\\.jpg\\. Opens full screen"
- extendedWaitUntil:
    visible: "ridge-landscape\\.jpg, image 1 of 5, from .*"
    timeout: 5000
- assertVisible: "1 of 5"
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible: "hut-portrait\\.jpg, image 2 of 5, from .*"
    timeout: 5000
- assertVisible: "2 of 5"
- tapOn:
    id: "viewer-close"
- extendedWaitUntil:
    notVisible: "2 of 5"
    timeout: 5000
- assertVisible: "Image, ridge-landscape\\.jpg\\. Opens full screen"
# The video's tile shows its first frame, which the phone reads from
# the file itself (the server makes none).
- scrollUntilVisible:
    element: "Video, ridge-walk\\.mp4, .*"
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: "attachment-video-poster"
    timeout: 15000
# A tap on the video opens it full screen, the last of the five, in the
# system's player, which plays it: the page, one element for a screen
# reader, has the value Playing once the player says so, and never comes
# to say it can't play or couldn't load (its label gains either at the
# end). The player's own controls are out of Maestro's sight under it,
# so pausing from them is checked by hand.
- scrollUntilVisible:
    element: "Video, ridge-walk\\.mp4, .*"
    direction: DOWN
- tapOn: "Video, ridge-walk\\.mp4, .*"
- extendedWaitUntil:
    visible: "ridge-walk\\.mp4, video 5 of 5, from [^,]+, [^,]+"
    timeout: 5000
- assertVisible: "5 of 5"
- extendedWaitUntil:
    visible: "Playing"
    timeout: 15000
- assertNotVisible: "ridge-walk\\.mp4, video 5 of 5, .*, (can't play|couldn't load)"
- tapOn:
    id: "viewer-close"
- extendedWaitUntil:
    notVisible: "5 of 5"
    timeout: 5000
# A tap on the PDF downloads it and opens the system's share sheet on it.
- scrollUntilVisible:
    element: "trail-notes\\.pdf, 585 B"
    direction: DOWN
- tapOn: "trail-notes\\.pdf, 585 B"
- extendedWaitUntil:
    visible: "Save to Files"
    timeout: 15000
# The system draws no close button on it, and a tap on its dismiss area
# reaches the row under it too, so it is swiped down from its header.
- swipe:
    from:
      text: "PDF Document.*"
    direction: DOWN
- extendedWaitUntil:
    notVisible: "Save to Files"
    timeout: 5000
- assertVisible: "trail-notes\\.pdf, 585 B"
# The audio file is the app's own player: nothing plays until Play, which
# becomes Pause while the time moves on against the file's length, and
# Pause stops it there.
- scrollUntilVisible:
    element: "Play ridge-wind\\.m4a"
    direction: DOWN
- assertVisible: "0:00"
- tapOn: "Play ridge-wind\\.m4a"
- extendedWaitUntil:
    visible: "Pause ridge-wind\\.m4a"
    timeout: 10000
- extendedWaitUntil:
    visible: "0:0[1-5] / 0:10"
    timeout: 10000
- tapOn: "Pause ridge-wind\\.m4a"
- extendedWaitUntil:
    visible: "Play ridge-wind\\.m4a"
    timeout: 5000
- assertVisible: "0:0\\d / 0:10"
