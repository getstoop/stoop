appId: ${APP_ID}
name: See files under messages, a photo, two in a grid, a PDF and an expired file, and share the PDF
---
# photos (seed.mjs): dee's landscape photo, then a portrait one, the two
# together, a PDF, and, newest, a photo since expired. Each file is one
# element, read by its kind and name.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "photos"
    timeout: 15000
- tapOn: "photos"
- extendedWaitUntil:
    visible: "photos, ${SPACE}, \\d+ members"
    timeout: 15000
- extendedWaitUntil:
    visible: "Expired attachment, \\d+(\\.\\d)? KB"
    timeout: 15000
- assertVisible: "trail-notes\\.pdf, 585 B"
- assertVisible: "Image 1 of 2, ridge-landscape\\.jpg"
- assertVisible: "Image 2 of 2, hut-portrait\\.jpg"
- assertVisible: "Image, hut-portrait\\.jpg"
- scrollUntilVisible:
    element: "Image, ridge-landscape\\.jpg"
    direction: UP
- assertNotVisible: "📎.*"
# A long press on a photo is the row's: the menu's card draws the
# message's files small, the photo once more under the same name.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Image, ridge-landscape\\.jpg"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- assertVisible:
    id: "attachment-strip-compact"
- tapOn:
    id: "message-menu-close"
- extendedWaitUntil:
    notVisible: "Quote in reply"
    timeout: 5000
# A tap on the PDF downloads it and opens the system's share sheet on it.
- scrollUntilVisible:
    element: "trail-notes\\.pdf, 585 B"
    direction: DOWN
- tapOn: "trail-notes\\.pdf, 585 B"
- extendedWaitUntil:
    visible: "Save to Files"
    timeout: 15000
# The system draws no close button on it; this is its dismiss area.
- tapOn: "dismiss popup"
- extendedWaitUntil:
    notVisible: "Save to Files"
    timeout: 5000
- assertVisible: "trail-notes\\.pdf, 585 B"
