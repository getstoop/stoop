appId: ${APP_ID}
name: Quote a message in a reply, cancel it, send it, and see the quote go with its message
---
# After channel.yaml, which needs chapters unread for ada with only dee's
# first notes in it: ada writes here (and deletes it again, so the seed
# is left as found), and alphabetical order carries that today, as it
# puts this flow before send.yaml, which minds nothing of it. As ada,
# quoting dee's notes.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
    timeout: 15000
# Quote in reply closes the sheet, rings the note and opens the card on
# the reply strip, which names dee and the note's words. Before each
# long press the list settles.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Chapter 55 notes"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- tapOn: "Quote in reply"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
- assertVisible: "Replying to ${POSTER} · Chapter 55 notes"
- assertVisible: "Cancel reply"
- assertVisible:
    id: "reply-target"
# The keyboard put away, the pill says what is being quoted and the ring
# stays; tapping it opens the card again, with the strip.
- tapOn: "Chapter 54 notes"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
- assertVisible: "Replying to ${POSTER}"
- assertVisible:
    id: "reply-target"
- tapOn: "Replying to ${POSTER}"
- extendedWaitUntil:
    visible: "Cancel reply"
    timeout: 5000
# Cancel reply drops the strip and the ring.
- tapOn: "Cancel reply"
- extendedWaitUntil:
    notVisible: "Cancel reply"
    timeout: 5000
- assertNotVisible:
    id: "reply-target"
- tapOn: "Chapter 54 notes"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
- assertVisible: "Message #chapters"
# Quoted again and sent, the reply lands once, saying whom it answers,
# and the strip is gone; the server has it as a reply to the note.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Chapter 55 notes"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- tapOn: "Quote in reply"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
- inputText: "Coffee ring copy it is"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Coffee ring copy it is"
    timeout: 10000
- assertVisible: "↳ Replying to ${POSTER}: Chapter 55 notes"
- assertNotVisible:
    text: "Coffee ring copy it is"
    index: 1
- assertNotVisible: "Cancel reply"
- assertNotVisible:
    id: "reply-target"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: repliesTo
      CHANNEL_ID: ${CHAPTERS_ID}
      QUOTED_TEXT: Chapter 55 notes
      TEXT: Coffee ring copy it is
- assertTrue: ${output.repliesTo}
- runScript:
    file: scripts/rpc.js
    env:
      STEP: ownerUnsays
- extendedWaitUntil:
    notVisible: "Coffee ring copy it is"
    timeout: 10000
- tapOn: "Chapter 54 notes"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
# A note quoted and then deleted by its author from another device: the
# strip goes with it, and the draft stays.
- runScript:
    file: scripts/rpc.js
    env:
      STEP: say
      CHANNEL_ID: ${CHAPTERS_ID}
      TEXT: Going once
- extendedWaitUntil:
    visible: "Going once"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Going once"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- tapOn: "Quote in reply"
- extendedWaitUntil:
    visible: "Replying to ${POSTER} · Going once"
    timeout: 5000
- inputText: "Still here"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: unsay
- extendedWaitUntil:
    notVisible: "Going once"
    timeout: 10000
- assertNotVisible: "Cancel reply"
- assertVisible:
    id: "composer"
    text: "Still here"
- eraseText: 20
- tapOn: "Chapter 54 notes"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
- assertVisible: "Message #chapters"
