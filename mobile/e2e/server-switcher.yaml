appId: ${APP_ID}
name: Add a second server, see the first one's badge on the chip and in the switcher, switch back
---
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, selected, 1 mention"
    timeout: 15000
# One server so far: no chip by the tab bar, and the second is added
# from You.
- assertNotVisible:
    id: "server-switcher"
- tapOn:
    id: "tab-you"
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SECOND_SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, selected, 1 mention"
    timeout: 15000
# Now on the second: the first carries Book club's mention, on the chip
# and in the switcher it opens.
- extendedWaitUntil:
    visible: ".*\\. Switch server, 1 new on other servers"
    timeout: 15000
- tapOn:
    id: "server-switcher"
- extendedWaitUntil:
    visible: ".*, 127\\.0\\.0\\.1:\\d+, current server"
    timeout: 5000
- extendedWaitUntil:
    visible: ".*, localhost:\\d+, 1 new"
    timeout: 15000
- tapOn: ".*, localhost:\\d+, 1 new"
- extendedWaitUntil:
    visible: "${SPACE}, selected, 1 mention"
    timeout: 15000
- tapOn:
    id: "server-switcher"
- extendedWaitUntil:
    visible: ".*, localhost:\\d+, current server"
    timeout: 5000
