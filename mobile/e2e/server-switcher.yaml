appId: ${APP_ID}
name: Add a second server from the switcher, see the first one's badge, switch back
---
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, 1 mention, Reading The Overstory"
    timeout: 15000
# One server so far: the switcher ticks it.
- tapOn:
    id: "server-switcher"
- extendedWaitUntil:
    visible: ".*, localhost:\\d+, current server"
    timeout: 5000
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SECOND_SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, 1 mention, Reading The Overstory"
    timeout: 15000
# Now on the second: the first carries Book club's mention.
- tapOn:
    id: "server-switcher"
- extendedWaitUntil:
    visible: ".*, 127\\.0\\.0\\.1:\\d+, current server"
    timeout: 5000
- extendedWaitUntil:
    visible: ".*, localhost:\\d+, 1 mention"
    timeout: 15000
- tapOn: ".*, localhost:\\d+, 1 mention"
- extendedWaitUntil:
    visible: "${SPACE}, 1 mention, Reading The Overstory"
    timeout: 15000
- tapOn:
    id: "server-switcher"
- extendedWaitUntil:
    visible: ".*, localhost:\\d+, current server"
    timeout: 5000
