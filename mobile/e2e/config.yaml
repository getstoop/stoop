# Maestro runs a directory's flows in no fixed order; some of these lean
# on theirs (mobile/README.md → Tests), so this is the order, by file
# name. Maestro matches a flow here by its `name`, so each is written
# as its file names it. A new flow is added here as well as to the
# directory.
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - "Open a channel and read it, from what is new back to the beginning, kept live"
    - "Edit a message from its menu, cancel an edit, and see Save refuse an emptied one"
    - "Edit a formatted message and see its formatting and mention kept"
    - "Paste an invite link and create an account with it"
    - "Open an invite from the web's open-in-app link, sign in and join"
    - "React to a message from its menu, copy its words, and delete it"
    - "Long-press a message and see its menu, with what the reader may do to it"
    - "Pick a reaction from the emoji picker, and copy a message's link"
    - "Pin a message from its menu, see it marked, and unpin it"
    - "Quote a message in a reply, cancel it, send it, and see the quote go with its message"
    - "Write in a channel and see it land, once, where it was sent"
    - "Format words from the row, at the caret and over a selection, and see them sent in Markdown"
    - "Link words from the format row through the link dialog, and see the link sent"
    - "Quote lines and write a code block from the format row, leave each, and see them sent"
    - "Write bulleted and numbered lists from the format row, indent and leave them, and see them sent"
    - "Format as you type, undo a shortcut with backspace, and paste Markdown, and see them sent"
    - "Type mentions in full and see them sent as mentions"
    - "Pick mentions from the list, from @, the @ button and #, and see them sent"
    - "Add a second server from the switcher, see the first one's badge, switch back"
    - "Add a server, sign in, see Spaces, change the theme, sign out"
    - "Open a space and see its channels, with what is waiting in each, kept live"
    - "Open a thread from its replies line and from Reply in thread, and read it, kept live"
    - "Reply in a thread, also to the channel, and edit, react and delete there"
    - "Mute a thread, see a reply in it counted as nothing new, and unmute it"
    - "Read messages in Markdown, reveal a spoiler, open a channel from its link, and see its blocks"
    - "See link previews under messages, open a message's menu from one, and remove one"
    - "See files under messages, a photo, two in a grid, a PDF, a video, an audio file and an expired file, page through the photos full screen, play the video and the audio, and share the PDF"
    - "Attach from the library, the camera and files, see it in the card and the pill, and send it"
