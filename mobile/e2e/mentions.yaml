appId: ${APP_ID}
name: Type mentions in full and see them sent as mentions
---
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
    timeout: 15000
- tapOn: "Message #chapters"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
# A person, a group and a channel, each typed in full with one owner, go
# as their tokens; a handle nobody has stays words.
- inputText: "@${POSTER} and @readers, snacks in #random? cc @nobody"
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*snacks in .*cc @nobody"
    timeout: 10000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: typedMentions
      CHANNEL_ID: ${CHAPTERS_ID}
- assertTrue: ${output.typedMentions}
# A handle typed in full becomes a pill as the word ends, one unit: the
# first backspace takes the space after it, the next the whole pill.
- inputText: "cc @${POSTER} "
- pressKey: Backspace
- pressKey: Backspace
- assertVisible:
    id: "composer"
    text: "cc "
- inputText: "done"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "cc done"
    timeout: 10000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: count
      CHANNEL_ID: ${CHAPTERS_ID}
      TEXT: "cc done"
- assertTrue: ${output.count == 1}
