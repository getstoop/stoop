appId: ${APP_ID}
name: Long-press a channel on Spaces, mute and unmute it, copy its link, and read what it is about
---
# As ada (seed.mjs), in Book club. A long press on random opens its menu
# over the row drawn as a card; Mute marks the row muted and the server
# holds it, Unmute takes it back; Copy link closes the sheet. The row
# changes once the server has answered, so what the server holds is
# asked again until it has. random is unread or read by now, as the
# flows before left it, and has no topic, so its menu has no About this
# channel; off-topic's has, and opens its topic in a sheet of its own.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible:
      id: "space-${SPACE_ID}"
    timeout: 15000
- extendedWaitUntil:
    visible: "random(, unread)?"
    timeout: 15000
# Mute: the row says so.
- longPressOn: "random(, unread)?"
- extendedWaitUntil:
    visible: "Copy link"
    timeout: 5000
- tapOn: "Mute"
- extendedWaitUntil:
    visible: "random, muted"
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: scripts/rpc.js
          env:
            STEP: channelState
      - assertTrue: ${output.channelMuted == true}
# Unmute takes it back.
- longPressOn: "random, muted"
- extendedWaitUntil:
    visible: "Unmute"
    timeout: 5000
- tapOn: "Unmute"
- extendedWaitUntil:
    visible: "random(, unread)?"
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: scripts/rpc.js
          env:
            STEP: channelState
      - assertTrue: ${output.channelMuted == false}
# Copy link closes the sheet.
- longPressOn: "random(, unread)?"
- extendedWaitUntil:
    visible: "Copy link"
    timeout: 5000
- assertNotVisible: "About this channel"
- tapOn: "Copy link"
- extendedWaitUntil:
    notVisible: "Copy link"
    timeout: 5000
# About this channel: the topic, in a sheet the scrim closes.
- longPressOn: "off-topic, muted"
- extendedWaitUntil:
    visible: "About this channel"
    timeout: 5000
- tapOn: "About this channel"
- extendedWaitUntil:
    visible: "Anything but the book"
    timeout: 5000
- assertNotVisible: "Copy link"
- tapOn:
    id: "channel-about-close"
- extendedWaitUntil:
    notVisible: "Anything but the book"
    timeout: 5000
- assertVisible: "off-topic, muted"
