appId: ${APP_ID}
name: See a mention in Activity with the tab's badge, open it, and see it read
---
# As ada (seed.mjs). Mark all read first clears what the seed and the
# flows before left unread (dee's mention in general among it, which
# space-channels.yaml needs unread, so this flow goes after it), so the
# badge is this flow's own. Then dee mentions ada in a channel made for
# it, as another device would, and it arrives live.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn:
    id: "tab-activity"
- extendedWaitUntil:
    visible: "Mark all read"
    timeout: 15000
- tapOn: "Mark all read"
- extendedWaitUntil:
    visible: "You're all caught up."
    timeout: 10000
- assertNotVisible: "Mark all read"
- assertNotVisible:
    id: "tab-activity"
    text: ".*items?|Activity, \\d+ new"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: create
      CHANNEL_NAME: activity-check
- runScript:
    file: scripts/rpc.js
    env:
      STEP: mention
# The row, under New: who, what, where, unread, and the words, with the
# channel's name looked up once the space's list has it.
- extendedWaitUntil:
    visible: "${POSTER} mentioned you in #activity-check, ${SPACE}, unread, .*over here"
    timeout: 15000
- assertVisible: "New 1"
# The tab's badge: iOS gives the tab its count as its value ("1
# item"); on Android the app's own label says it ("Activity, 1 new").
- assertVisible:
    id: "tab-activity"
    text: "1 item|Activity, 1 new"
- tapOn: "${POSTER} mentioned you in #activity-check, ${SPACE}, unread, .*"
- extendedWaitUntil:
    visible: "activity-check, ${SPACE}, \\d+ members"
    timeout: 15000
- assertVisible: ".*over here"
- tapOn: "Back"
# Back on Activity: the row has moved under Read, and the badge has gone.
- extendedWaitUntil:
    visible: "(Today, )?${POSTER} mentioned you in #activity-check, ${SPACE}, (just now|\\d+m ago): .*over here"
    timeout: 10000
- assertNotVisible: ".*activity-check.*unread.*"
- assertVisible: "You're all caught up."
- assertNotVisible:
    id: "tab-activity"
    text: ".*items?|Activity, \\d+ new"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: delete
