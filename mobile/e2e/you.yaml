appId: ${APP_ID}
name: See who you are on You, refreshed by a pull, and think better of signing out
---
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn:
    id: "tab-you"
- extendedWaitUntil:
    visible: "@${MEMBER} · on .*"
    timeout: 15000
- assertVisible: "This phone"
- assertVisible: "Theme, .*"
# Notifications shows, and does nothing yet.
- tapOn: "Notifications, Mentions & messages"
- assertVisible: "@${MEMBER} · on .*"
# Pronouns set on another device, seen on a pull.
- runScript:
    file: scripts/rpc.js
    env:
      STEP: setPronouns
      TEXT: she/her
- swipe:
    start: "50%, 30%"
    end: "50%, 80%"
- extendedWaitUntil:
    visible: "@${MEMBER} · she/her · on .*"
    timeout: 15000
# Signing out asks first; Cancel leaves everything as it was.
- tapOn: "Sign out of .*"
- extendedWaitUntil:
    visible: "Sign out of .*\\?"
    timeout: 5000
- tapOn: "Cancel"
- assertVisible: "@${MEMBER} · she/her · on .*"
# Still signed in, on the same server, once anything would have happened.
- tapOn:
    id: "tab-spaces"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: setPronouns
      TEXT: ""
