appId: ${APP_ID}
name: Add a server, sign in, see Spaces, change the theme, sign out
---
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
# Each space on the rail with what is waiting in it (seed.mjs), read
# from the buttons' accessibility labels; the first is the one selected.
- extendedWaitUntil:
    visible: "${SPACE}, selected, 1 mention"
    timeout: 15000
- assertVisible: "Climbing crew, unread"
- assertVisible: "Garden swap, muted"
- tapOn:
    id: "tab-you"
- extendedWaitUntil:
    visible: "@${MEMBER} · on .*"
    timeout: 15000
# The theme: picked on its own screen, shown on You, kept across a launch.
- tapOn:
    id: "theme-row"
- tapOn:
    id: "theme-daylight"
- tapOn: "Back|Navigate up"
- assertVisible: "Theme, Daylight"
- stopApp
- launchApp
- tapOn:
    id: "tab-you"
- assertVisible: "Theme, Daylight"
- tapOn: "Sign out of .*"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "I have an invite link"
    timeout: 15000
