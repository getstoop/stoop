appId: ${APP_ID}
name: Add a server, sign in with a password, sign out
---
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
# Each space with what is waiting in it (seed.mjs), read from the rows'
# accessibility labels.
- extendedWaitUntil:
    visible: "${SPACE}, 1 mention, Reading The Overstory"
    timeout: 15000
- assertVisible: "Climbing crew, unread"
- assertVisible: "Garden swap, muted"
- tapOn:
    id: "tab-you"
- extendedWaitUntil:
    visible: "Signed in as ${MEMBER}.*"
    timeout: 15000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "I have an invite link"
    timeout: 15000
