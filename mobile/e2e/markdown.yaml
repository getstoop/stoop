appId: ${APP_ID}
name: Read messages in Markdown, reveal a spoiler, open a channel from its link, and see its blocks
---
# formatting (seed.mjs): ada's marks message, her long spoiler and her
# emoji-only message, all read, and above them her quotes, lists and code
# block. A paragraph's words are one element read as a whole; its links
# are elements of their own.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "formatting"
    timeout: 15000
- tapOn: "formatting"
- extendedWaitUntil:
    visible: "formatting, ${SPACE}, \\d+ members"
    timeout: 15000
# The marks drawn, not their markers: the words read without a * or a
# backtick, the mentions and the channel link as their names.
- assertVisible: "Bold italic underline strike code and the docs, over in #random for @here and @${POSTER}, with a tree 🌳 among the words of a line long enough to wrap"
# The link and the channel link are links of their own.
- assertVisible: "the docs"
- assertVisible: "#random"
# The emoji-only message.
- assertVisible: "🌳🍂"
# A spoiler is covered, its words not read out, until a tap reveals it;
# in a link's words too, where the link is not read out as them.
- assertVisible: "Read the spoiler, double tap to reveal ending later"
- assertNotVisible: ".*burnt.*"
# That link is no element of its own: its words around the cover would be
# read as the link, with nothing where the spoiler is.
- assertNotVisible: "the\\s*"
- assertNotVisible: "\\s*ending"
- assertNotVisible: "the\\s+ending"
- assertVisible: "spoiler, double tap to reveal"
- assertNotVisible: ".*oldest tree.*"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "spoiler, double tap to reveal"
- extendedWaitUntil:
    visible: "The narrator was the oldest tree 🍂"
    timeout: 5000
- assertNotVisible: "spoiler, double tap to reveal"
# The channel link opens random.
- tapOn: "#random"
- extendedWaitUntil:
    visible: "random, ${SPACE}, \\d+ members"
    timeout: 15000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "formatting, ${SPACE}, \\d+ members"
    timeout: 15000
# A long press on a link is the row's: the message menu opens, not the link.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "the docs"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- tapOn:
    id: "message-menu-close"
- extendedWaitUntil:
    notVisible: "Quote in reply"
    timeout: 5000
# The blocks, older, above. A quote's words, a list row's and a code
# block's are each an element: a row read with its number, or "•" for a
# bullet at any depth, before its words; the code as written.
- scrollUntilVisible:
    element: "Who\\? spoiler, double tap to reveal"
    direction: UP
    centerElement: true
    timeout: 30000
# A spoiler in a quote is covered, its words not read out, until a tap
# on it (the middle of the quote's line) reveals it.
- assertNotVisible: ".*gardener.*"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Who\\? spoiler, double tap to reveal"
- extendedWaitUntil:
    visible: "Who\\? The gardener, with a trowel"
    timeout: 5000
# A code block keeps its marks, @here and link as written.
- scrollUntilVisible:
    element: "// \\*\\*left as written\\*\\* @here https://example\\.com\\s+const route = .*"
    direction: UP
    centerElement: true
    timeout: 30000
# Dragged sideways it scrolls, and a long press on it is still the row's.
# Aimed at the block's box: its text is wider than the screen, and its
# middle off it.
- swipe:
    from:
      id: "code-block"
    direction: LEFT
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn:
    id: "code-block"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- tapOn:
    id: "message-menu-close"
- extendedWaitUntil:
    notVisible: "Quote in reply"
    timeout: 5000
# A numbered list counts from one, a bulleted row inside it on its own,
# and "(edited)" goes on a line of its own after it.
- scrollUntilVisible:
    element: "1\\. Warm up"
    direction: UP
    centerElement: true
    timeout: 30000
- assertVisible: "2\\. Climb"
- assertVisible: "• lead"
- assertVisible: "3\\. Stretch"
- assertVisible: "4\\. Eat"
- assertVisible: "\\s*\\(edited\\)"
# A nested bulleted list, with a link in a row that is a link of its own;
# a long press on it is the row's.
- scrollUntilVisible:
    element: "• rope"
    direction: UP
    centerElement: true
    timeout: 30000
- assertVisible: "Packing list:"
- assertVisible: "• 60 m"
- assertVisible: "• dry treated"
- assertVisible: "• the route topo"
- assertVisible: "route topo"
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "route topo"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- tapOn:
    id: "message-menu-close"
- extendedWaitUntil:
    notVisible: "Quote in reply"
    timeout: 5000
# A quote reads its words, both lines.
- scrollUntilVisible:
    element: "Every tree was once a nut\\s+that held its ground"
    direction: UP
    centerElement: true
    timeout: 30000
