appId: ${APP_ID}
name: Edit a formatted message and see its formatting and mention kept
---
# As ada, in chapters, after the edit flow: a note she wrote from
# another device in Markdown (bold, inline code, a mention of dee, a
# quote and a list) loads into the composer's rich field as it reads, and
# saves with only what was typed changed. She deletes it at the end, so
# the seed is left as found.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
    timeout: 15000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: ownerFormats
      CHANNEL_ID: ${CHAPTERS_ID}
- extendedWaitUntil:
    visible: "Bring the paperback, cc .*"
    timeout: 10000
# The field holds the note's words, its markers never: the mention as
# its @handle, the quote and the list as their lines.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Bring the paperback, cc .*"
- extendedWaitUntil:
    visible: "Edit message"
    timeout: 5000
- tapOn: "Edit message"
- extendedWaitUntil:
    visible: "Editing message"
    timeout: 5000
- assertVisible:
    id: "composer"
    text: "Bring the paperback, cc @${POSTER}\nby Thursday\none\ntwo"
# Typed at the end, the last item grows; the rest saves as it was.
- inputText: ", please"
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Editing message"
    timeout: 10000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: formattedIs
      CHANNEL_ID: ${CHAPTERS_ID}
      SUFFIX: ", please"
- assertTrue: ${output.formattedIs}
# Saved again with nothing changed, nothing is sent: the field writes
# the note back as the server holds it. The tap that puts the keyboard
# away lands on the note itself, which is on screen by construction (an
# older row may have scrolled under the keyboard).
- tapOn: "Bring the paperback, cc .*"
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Bring the paperback, cc .*"
- extendedWaitUntil:
    visible: "Edit message"
    timeout: 5000
- tapOn: "Edit message"
- extendedWaitUntil:
    visible: "Editing message"
    timeout: 5000
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Cancel editing"
    timeout: 5000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: unchangedSince
      CHANNEL_ID: ${CHAPTERS_ID}
- assertTrue: ${output.unchangedSince}
- runScript:
    file: scripts/rpc.js
    env:
      STEP: ownerUnsays
