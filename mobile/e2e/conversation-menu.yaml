appId: ${APP_ID}
name: Long-press a conversation in Messages, mute and unmute it, copy its link, and close it until it is written in
---
# As ada (seed.mjs), in her conversation with dee (messages.yaml). A long
# press opens its menu over the row drawn as a card; Mute marks the row
# muted and the server holds it, Unmute takes it back; Copy link closes
# the sheet; Close conversation takes the row off her list, and dee
# writing brings it back. The row changes before the server answers,
# so what the server holds is asked again until it has.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn:
    id: "tab-messages"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: dmSay
      TEXT: Did the plants make it?
- extendedWaitUntil:
    visible: "${POSTER}, offline, unread, .*, Did the plants make it\\?"
    timeout: 15000
# Mute: the row says so, and stops counting as unread.
- longPressOn: "${POSTER}, offline, unread, .*"
- extendedWaitUntil:
    visible: "Close conversation"
    timeout: 5000
- assertVisible: "Copy link"
- tapOn: "Mute"
- extendedWaitUntil:
    visible: "${POSTER}, offline, muted, .*, Did the plants make it\\?"
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: scripts/rpc.js
          env:
            STEP: dmState
      - assertTrue: ${output.dmMuted == true}
# Unmute takes it back.
- longPressOn: "${POSTER}, offline, muted, .*"
- extendedWaitUntil:
    visible: "Unmute"
    timeout: 5000
- tapOn: "Unmute"
- extendedWaitUntil:
    visible: "${POSTER}, offline, unread, .*, Did the plants make it\\?"
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: scripts/rpc.js
          env:
            STEP: dmState
      - assertTrue: ${output.dmMuted == false}
# Copy link closes the sheet.
- longPressOn: "${POSTER}, offline, unread, .*"
- extendedWaitUntil:
    visible: "Copy link"
    timeout: 5000
- tapOn: "Copy link"
- extendedWaitUntil:
    notVisible: "Close conversation"
    timeout: 5000
# Close conversation: off the list, and closed on the server.
- longPressOn: "${POSTER}, offline, unread, .*"
- extendedWaitUntil:
    visible: "Close conversation"
    timeout: 5000
- tapOn: "Close conversation"
- extendedWaitUntil:
    notVisible: "${POSTER}, offline, .*"
    timeout: 10000
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: scripts/rpc.js
          env:
            STEP: dmState
      - assertTrue: ${output.dmClosed == true}
# dee writes, and it is back.
- runScript:
    file: scripts/rpc.js
    env:
      STEP: dmSay
      TEXT: They're thriving
- extendedWaitUntil:
    visible: "${POSTER}, offline, unread, .*, They're thriving"
    timeout: 15000
