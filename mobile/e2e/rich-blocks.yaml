appId: ${APP_ID}
name: Quote lines and write a code block from the format row, leave each, and see them sent
---
# As ada, in chapters, after send.yaml.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
# Read already when channel.yaml ran first.
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
- tapOn: "Message #chapters"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
- tapOn: "Formatting"
# The row scrolls sideways; its block buttons are past the marks.
- swipe:
    from:
      id: "format-row"
    direction: LEFT
# Quote: the line becomes a quote line; Return carries the quote on, and
# Return on an empty quote line leaves it.
- inputText: "quoted line"
- tapOn: "Quote"
- assertVisible:
    text: "Quote"
    selected: true
- pressKey: Enter
- inputText: "second"
- pressKey: Enter
- pressKey: Enter
- assertVisible:
    text: "Quote"
    selected: false
- inputText: "after"
# Code block: Return adds a line, Return on its blank last line leaves it.
- pressKey: Enter
- tapOn: "Code block"
- inputText: "x = 1"
- pressKey: Enter
- inputText: "y = 2"
- pressKey: Enter
- pressKey: Enter
- inputText: "done"
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*done.*"
    timeout: 10000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: count
      CHANNEL_ID: ${CHAPTERS_ID}
      TEXT: "> quoted line\n> second\nafter\n```\nx = 1\ny = 2\n```\ndone"
- assertTrue: ${output.count == 1}
