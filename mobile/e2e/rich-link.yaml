appId: ${APP_ID}
name: Link words from the format row through the link dialog, and see the link sent
---
# As ada, in chapters, after send.yaml.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
# Read already when channel.yaml ran first.
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
- tapOn: "Message #chapters"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
# Link opens the dialog at the caret with no words; an address the format
# can't read is refused in web's words, and the dialog stays.
- inputText: "Read "
- tapOn: "Formatting"
- tapOn: "Link"
- extendedWaitUntil:
    visible: "Add link"
    timeout: 5000
- tapOn:
    id: "link-text"
- inputText: "the guide"
- tapOn:
    id: "link-href"
- eraseText: 20
- inputText: "guide.example"
- tapOn: "Save"
- assertVisible: "Enter an address starting with http:// or https://"
- eraseText: 20
- inputText: "https://guide.example"
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "Add link"
    timeout: 5000
# The card stayed open; typed after the link, words aren't linked.
- assertVisible:
    id: "composer"
    text: "Read the guide"
- inputText: " now"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Read the guide now"
    timeout: 10000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: count
      CHANNEL_ID: ${CHAPTERS_ID}
      TEXT: "Read [the guide](https://guide.example) now"
- assertTrue: ${output.count == 1}
