appId: ${APP_ID}
name: Search a space's messages from the channel header and see a match
---
# As ada in chapters (seed.mjs), whose notes are numbered, so one word
# finds one note. The row is one button, named by its author, channel,
# day and words.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
    timeout: 15000
- tapOn: "Search in ${SPACE}"
# The field arrives narrowed to the channel, focused, with the keyboard
# up: the words go after its in:#chapters.
- extendedWaitUntil:
    visible: "Search messages in ${SPACE}"
    timeout: 10000
- assertVisible: "This channel"
- inputText: "Chapter 50"
- pressKey: Enter
- extendedWaitUntil:
    visible: ".* in #chapters, .*: Chapter 50 notes"
    timeout: 15000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
    timeout: 10000
