appId: ${APP_ID}
name: See link previews under messages, open a message's menu from one, and remove one
---
# links (seed.mjs): ada's messages with the server's previews of a page
# with a wide image, a page with a square one and an image on its own,
# and, newest, a link to one of formatting's messages. Each card is one
# link element, read as its site, title and description, or its site
# alone for an image.
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
- extendedWaitUntil:
    visible: "links"
    timeout: 15000
- tapOn: "links"
- extendedWaitUntil:
    visible: "links, ${SPACE}, \\d+ members"
    timeout: 15000
- extendedWaitUntil:
    visible: "Example Trails, Ridge loop, A five-mile loop over the ridge, with the hut at the halfway mark\\."
    timeout: 15000
# No site name: the link's host stands in.
- assertVisible: "127\\.0\\.0\\.1:\\d+, The hut, Bunks for twelve, a stove and a view of the valley\\."
- assertVisible: "127\\.0\\.0\\.1:\\d+"
# The trail's message was edited: "(edited)" comes after its card, as
# on web, not after its words.
- assertVisible:
    text: "\\(edited\\)"
    below: "Example Trails, Ridge loop.*"
- assertNotVisible: "Trail map for Saturday.*\\(edited\\)"
# A link to a message on this server gets no card of this server's page.
- assertNotVisible: "localhost:\\d+, Stoop.*"
# A long press on a card is the row's: the message menu opens.
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "Example Trails, Ridge loop.*"
- extendedWaitUntil:
    visible: "Quote in reply"
    timeout: 5000
- tapOn:
    id: "message-menu-close"
- extendedWaitUntil:
    notVisible: "Quote in reply"
    timeout: 5000
# The author's × takes the trail's card off, for everyone, once asked.
- tapOn:
    text: "Remove preview"
    index: 0
- extendedWaitUntil:
    visible: "Remove this preview\\?"
    timeout: 5000
- tapOn: "Remove"
- extendedWaitUntil:
    notVisible: "Example Trails, Ridge loop.*"
    timeout: 10000
- assertVisible: "127\\.0\\.0\\.1:\\d+, The hut, .*"
# With no card left, "(edited)" closes the words again.
- assertVisible: "Trail map for Saturday.*\\(edited\\)"
