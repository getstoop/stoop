appId: ${APP_ID}
name: Open an invite from the web's open-in-app link, sign in and join
---
- clearKeychain
- launchApp:
    clearState: true
- openLink: ${OPEN_LINK}
# iOS asks before following a link into an app, as it does from Safari,
# until the simulator has been told Open once.
- extendedWaitUntil:
    visible: "Open in .*"
    timeout: 3000
    optional: true
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: ${SPACE}
    timeout: 15000
- tapOn: "Sign in & join"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${OUTSIDER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- assertNotVisible: "Couldn't join the space"
# Spaces lists the invite's space: the account joined it.
- extendedWaitUntil:
    visible: "Spaces"
    timeout: 15000
# The row reads as the name and what is waiting in it.
- assertVisible: "${SPACE}(, .*)?"
