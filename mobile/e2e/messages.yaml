appId: ${APP_ID}
name: See a direct message arrive in Messages, unread, then read, then answered
---
# As ada (seed.mjs). dee writes to ada, as another device would, and the
# row arrives live: dee's name, unread, the words. ada reads it and
# answers elsewhere, and the row follows: no longer unread, then her
# answer, said as hers. dee holds no socket, so her row says she is
# offline: presence came with the socket's Ready. Rows open nothing yet
# (no conversation screen).
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn:
    id: "tab-messages"
- extendedWaitUntil:
    visible: "New message"
    timeout: 15000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: dmSay
      TEXT: Are you around Saturday?
- extendedWaitUntil:
    visible: "${POSTER}, offline, unread, .*, Are you around Saturday\\?"
    timeout: 15000
- runScript:
    file: scripts/rpc.js
    env:
      STEP: dmRead
- extendedWaitUntil:
    visible: "${POSTER}, offline, [^,]*, Are you around Saturday\\?"
    timeout: 10000
- assertNotVisible: "${POSTER}, offline, unread, .*"
- runScript:
    file: scripts/rpc.js
    env:
      STEP: dmAnswer
      TEXT: After lunch works
- extendedWaitUntil:
    visible: "${POSTER}, offline, [^,]*, You: After lunch works"
    timeout: 10000
