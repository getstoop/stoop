appId: ${APP_ID}
name: Write in a channel and see it land, once, where it was sent
---
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "${SPACE}, .*"
    timeout: 15000
- tapOn: "${SPACE}, .*"
# Read already when channel.yaml ran first.
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
    timeout: 15000
# At rest the composer is a pill that names the channel. Tapping it opens
# the card with the field focused; Send is a button, and Return is a
# newline, so a two-line draft is one message.
- assertVisible: "Message #chapters"
- tapOn: "Message #chapters"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
- inputText: "Bringing the extra copy"
- pressKey: Enter
- inputText: "Thursday, if that still helps"
- tapOn: "Send"
# The message lands as the server's row, under the reader's name.
- extendedWaitUntil:
    visible: "Bringing the extra copy\nThursday, if that still helps"
    timeout: 10000
- assertVisible: "${MEMBER}"
# The field was emptied by the send, so the next message is only what is
# typed now; and it is in the channel once, the socket's copy and the
# answer being one row.
- inputText: "And a pen"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "And a pen"
    timeout: 10000
# Once on screen (no second element with that text: the answer and the
# socket's copy merged into one row), and once on the server.
- assertNotVisible:
    text: "And a pen"
    index: 1
- runScript:
    file: scripts/rpc.js
    env:
      STEP: count
      CHANNEL_ID: ${CHAPTERS_ID}
      TEXT: And a pen
- assertTrue: ${output.count == 1}
# Formatting opens its row, which scrolls sideways; nothing in it does
# anything yet.
- tapOn: "Formatting"
- assertVisible: "Bold"
- assertVisible: "Bulleted list"
- tapOn: "Formatting"
- assertNotVisible: "Bold"
# Tapping the list puts the keyboard away and the pill back: the card's
# buttons go with it. (The field's placeholder reads "Message #chapters"
# too, so that text alone can't tell the two states apart.)
- tapOn: "And a pen"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
- assertNotVisible:
    id: "composer"
- assertVisible: "Message #chapters"
