appId: ${APP_ID}
name: Reply in a thread from further up and land on the reply
---
- clearKeychain
- launchApp:
    clearState: true
- tapOn: "Add a server"
- tapOn:
    id: "server-address"
- inputText: ${SERVER}
- extendedWaitUntil:
    visible: "Found"
    timeout: 15000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Sign in to .*"
    timeout: 15000
- tapOn:
    id: "username"
- inputText: ${MEMBER}
- tapOn:
    id: "password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible:
      id: "space-${SPACE_ID}"
    timeout: 15000
- tapOn:
    id: "space-${SPACE_ID}"
# Read already when channel.yaml ran first.
- extendedWaitUntil:
    visible: "chapters(, unread)?"
    timeout: 15000
- tapOn: "chapters(, unread)?"
- extendedWaitUntil:
    visible: "chapters, ${SPACE}, \\d+ members"
    timeout: 15000
# As ada, on a root of its own in chapters. Tall replies, so the thread
# scrolls with the keyboard up: scrolled up from the newest reply, the list
# doesn't follow a row by itself, but the reader's own send brings them back.
- tapOn: "Message #chapters"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
- inputText: "A long thread"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "A long thread"
    timeout: 10000
- tapOn: "A long thread"
- extendedWaitUntil:
    notVisible: "Send"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn: "A long thread"
- extendedWaitUntil:
    visible: "Reply in thread"
    timeout: 5000
- tapOn: "Reply in thread"
- extendedWaitUntil:
    visible: "Thread, chapters, ${SPACE}"
    timeout: 10000
- tapOn: "Reply in thread"
- extendedWaitUntil:
    visible:
      id: "composer"
    timeout: 5000
- inputText: "First line 1"
- pressKey: Enter
- inputText: "First line 2"
- pressKey: Enter
- inputText: "First line 3"
- pressKey: Enter
- inputText: "First line 4"
- pressKey: Enter
- inputText: "First line 5"
- pressKey: Enter
- inputText: "First line 6"
- pressKey: Enter
- inputText: "First line 7"
- pressKey: Enter
- inputText: "First line 8"
- pressKey: Enter
- inputText: "First line 9"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "First line 1.*"
    timeout: 10000
- inputText: "Second line 1"
- pressKey: Enter
- inputText: "Second line 2"
- pressKey: Enter
- inputText: "Second line 3"
- pressKey: Enter
- inputText: "Second line 4"
- pressKey: Enter
- inputText: "Second line 5"
- pressKey: Enter
- inputText: "Second line 6"
- pressKey: Enter
- inputText: "Second line 7"
- pressKey: Enter
- inputText: "Second line 8"
- pressKey: Enter
- inputText: "Second line 9"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Second line 1.*"
    timeout: 10000
- inputText: "Third line 1"
- pressKey: Enter
- inputText: "Third line 2"
- pressKey: Enter
- inputText: "Third line 3"
- pressKey: Enter
- inputText: "Third line 4"
- pressKey: Enter
- inputText: "Third line 5"
- pressKey: Enter
- inputText: "Third line 6"
- pressKey: Enter
- inputText: "Third line 7"
- pressKey: Enter
- inputText: "Third line 8"
- pressKey: Enter
- inputText: "Third line 9"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Third line 1.*"
    timeout: 10000
# Rows behind the composer still count as visible, so the thread's first
# message says where the list is: gone at the newest edge, back when
# scrolled up.
- extendedWaitUntil:
    notVisible: "A long thread"
    timeout: 5000
- swipe:
    start: 50%,18%
    end: 50%,48%
- swipe:
    start: 50%,18%
    end: 50%,48%
- extendedWaitUntil:
    visible: "A long thread"
    timeout: 5000
- inputText: "Back at the end"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Back at the end"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "A long thread"
    timeout: 5000
