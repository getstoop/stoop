version: 2

project_name: stoop

builds:
  - main: ./cmd/stoop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/getstoop/stoop/internal/buildinfo.Version={{ .Version }}
      - -X github.com/getstoop/stoop/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/getstoop/stoop/internal/buildinfo.Date={{ .Date }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - formats: [tar.gz]
    # No version in the name: `releases/latest/download/<name>` has to
    # resolve for the upgrade tool's fetch line in docs/self-hosting/install.md.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

dockers:
  - image_templates: ["ghcr.io/getstoop/stoop:{{ .Version }}-amd64"]
    use: buildx
    dockerfile: deploy/Dockerfile.goreleaser
    build_flag_templates: ["--platform=linux/amd64"]
  - image_templates: ["ghcr.io/getstoop/stoop:{{ .Version }}-arm64"]
    use: buildx
    dockerfile: deploy/Dockerfile.goreleaser
    goarch: arm64
    build_flag_templates: ["--platform=linux/arm64"]

# The full version only. `latest` moves when the release is published
# (.github/workflows/move-latest.yml).
docker_manifests:
  - name_template: ghcr.io/getstoop/stoop:{{ .Version }}
    image_templates:
      - ghcr.io/getstoop/stoop:{{ .Version }}-amd64
      - ghcr.io/getstoop/stoop:{{ .Version }}-arm64

# Left as a draft on the commit that was built. Publishing it is the
# release, and GitHub makes the tag then; Build release runs this with a
# tag that never leaves the runner.
#
# The compose bundle ships with each release so the quick start fetches
# files from the same commit the images were built from:
# https://github.com/getstoop/stoop/releases/latest/download/<file>
# The notes are deploy/release-notes.md, via --release-notes in Build
# release; each release candidate rewrites that file. The flag also turns
# the change list off. Disabling the changelog here as well would skip
# the step that reads the file, and the draft would have no notes.
release:
  draft: true
  replace_existing_draft: true
  target_commitish: "{{ .FullCommit }}"
  extra_files:
    - glob: deploy/docker-compose.yml
    - glob: deploy/livekit.yaml
    - glob: deploy/livekit-entrypoint.sh
    # GitHub refuses an asset name that starts with a dot (GoReleaser
    # would upload it as "default.env.example"), so it ships as env.example.
    - glob: deploy/.env.example
      name_template: env.example
