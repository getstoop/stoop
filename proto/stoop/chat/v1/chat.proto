syntax = "proto3";

package stoop.chat.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "stoop/chat/v1/channel.proto";
import "stoop/chat/v1/group.proto";
import "stoop/chat/v1/invite.proto";
import "stoop/chat/v1/member.proto";
import "stoop/chat/v1/message.proto";
import "stoop/chat/v1/pin.proto";
import "stoop/chat/v1/activity.proto";
import "stoop/chat/v1/space.proto";

// ChatService manages spaces, channels, and messages. A space is the
// community-level container: a group of channels and their members. It
// is deliberately not called a "server", so that word can unambiguously
// mean a Stoop instance. All RPCs require an authenticated session.
service ChatService {
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse) {}
  rpc ListSpaces(ListSpacesRequest) returns (ListSpacesResponse) {}
  // ListAllSpaces is every space on the server for a server admin, with
  // the counts their Spaces page shows. Needs instance.read. Listing a
  // space is not membership and subscribes the caller to nothing.
  rpc ListAllSpaces(ListAllSpacesRequest) returns (ListAllSpacesResponse) {}
  rpc GetSpace(GetSpaceRequest) returns (GetSpaceResponse) {}
  // JoinSpace redeems an invite code. Already-members are returned the
  // space without consuming a use.
  rpc JoinSpace(JoinSpaceRequest) returns (JoinSpaceResponse) {}
  // CreateInvite mints a shareable code for a space. Requires the
  // invites.create permission: space admins and the owner always hold it;
  // members only when the space's members_can_invite setting is on.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {}
  // ListInvites returns every invite for a space, newest first, including
  // revoked and exhausted ones. Same permission as CreateInvite.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse) {}
  // RevokeInvite permanently disables a code. The invite's creator may
  // always revoke it; anyone else needs manage_invites (admin+). Revoking
  // twice is a no-op.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {}
  // LookupInvite previews the space behind a code without redeeming it.
  // Public: this is what an invited stranger sees before they have an
  // account. It never returns the space's welcome text.
  rpc LookupInvite(LookupInviteRequest) returns (LookupInviteResponse) {}
  // GetMember describes one member of a space. Members only.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse) {}
  // ListMembers lists a space's members, owner first. Members only.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {}
  // SetMemberRole promotes or demotes a member (MEMBER or ADMIN; never
  // OWNER — see TransferOwnership). Requires members.manage, and the target
  // must rank below the caller (the owner and instance admins may act on
  // anyone but the owner).
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse) {}
  // KickMember removes another member. Same rules as SetMemberRole; use
  // LeaveSpace for yourself.
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse) {}
  // AddMember puts an existing account into the space directly, without
  // an invite — the admin page's "Add to space". Requires members.manage;
  // refused for banned users; a no-op error if they're already in.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse) {}
  // BanMember removes someone from the space (if they're in it) and keeps
  // them out: invites and JoinSpace refuse them until UnbanMember. Needs
  // members.manage and the same hierarchy rule as KickMember; the owner
  // can't be banned.
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse) {}
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse) {}
  rpc ListBans(ListBansRequest) returns (ListBansResponse) {}
  // ListGroups returns a space's groups with their people. Needs
  // space.read.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {}
  // CreateGroup, UpdateGroup and DeleteGroup need members.manage. A group
  // holds people who are members of the space, never bots; leaving the
  // space takes a person out of its groups.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {}
  // UpdateGroup replaces the handle, name and people.
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse) {}
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {}
  // BlockUser stops direct messages between the caller and another user
  // in both directions, hides their existing conversation from the
  // caller, and drops mention/reply alerts from them. Anyone may block
  // anyone; UnblockUser reverses it.
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse) {}
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse) {}
  rpc ListBlockedUsers(ListBlockedUsersRequest) returns (ListBlockedUsersResponse) {}
  // LeaveSpace removes the caller. The owner must transfer ownership first.
  rpc LeaveSpace(LeaveSpaceRequest) returns (LeaveSpaceResponse) {}
  // TransferOwnership makes another member the owner; the caller (owner)
  // becomes an admin.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse) {}
  // UpdateSpace changes the name and/or settings. Requires manage_space.
  rpc UpdateSpace(UpdateSpaceRequest) returns (UpdateSpaceResponse) {}
  // DeleteSpace removes the space and everything in it. Owner or instance
  // admin only.
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse) {}
  // CreateChannel requires manage_channels (admin+). Whoever creates a
  // private channel is its first member.
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse) {}
  // ListChannels is the space's public channels and the private ones the
  // caller is in.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {}
  // ListAllChannels is every channel in the space, private ones included,
  // for Space settings. Requires manage_channels. Listing a private
  // channel is not being in it and subscribes the caller to nothing.
  rpc ListAllChannels(ListAllChannelsRequest) returns (ListAllChannelsResponse) {}
  // ListChannelMembers is who is in a private channel, for someone in it
  // or with manage_channels.
  rpc ListChannelMembers(ListChannelMembersRequest) returns (ListChannelMembersResponse) {}
  // AddChannelMembers puts members of the space into a private channel.
  // Requires manage_channels; naming yourself is how an admin joins.
  rpc AddChannelMembers(AddChannelMembersRequest) returns (AddChannelMembersResponse) {}
  // RemoveChannelMember takes someone out of a private channel. Requires
  // manage_channels.
  rpc RemoveChannelMember(RemoveChannelMemberRequest) returns (RemoveChannelMemberResponse) {}
  // LeaveChannel takes the caller out of a private channel they are in.
  rpc LeaveChannel(LeaveChannelRequest) returns (LeaveChannelResponse) {}
  // UpdateChannel changes a channel's name and/or topic. Requires
  // manage_channels.
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse) {}
  // DeleteChannel removes a channel and its messages. Requires
  // manage_channels; a space always keeps at least one channel.
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse) {}
  // ReorderChannels sets the sidebar order from the given list of the
  // space's channel IDs: every channel the caller can see, and any
  // private ones they are not in (see ListAllChannels). One of those left
  // out keeps its place. Requires manage_channels.
  rpc ReorderChannels(ReorderChannelsRequest) returns (ReorderChannelsResponse) {}
  // SetChannelMuted sets the caller's own mute for a channel they can
  // read (a space's, or a direct message).
  rpc SetChannelMuted(SetChannelMutedRequest) returns (SetChannelMutedResponse) {}
  // SetSpaceMuted sets the caller's own mute for a space they belong to.
  rpc SetSpaceMuted(SetSpaceMutedRequest) returns (SetSpaceMutedResponse) {}
  // SetThreadMuted sets the caller's own mute for a thread in a channel
  // they can read. A muted thread writes them no thread_reply activity and
  // no banners; mentions and replies to them in it still reach the feed.
  rpc SetThreadMuted(SetThreadMutedRequest) returns (SetThreadMutedResponse) {}
  // ListThreadMutes returns the threads the caller muted, newest mute
  // first, in channels they can still read.
  rpc ListThreadMutes(ListThreadMutesRequest) returns (ListThreadMutesResponse) {}
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {}
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {}
  // ListChanges catches a channel up from a log position: every row with
  // a higher seq, tombstones and thread replies included. Same access as
  // ListMessages. See docs/architecture/messaging.md → History.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {}
  // SearchMessages finds messages by their words within one space the
  // caller belongs to, newest first. See docs/architecture/messaging.md.
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse) {}
  // SetMessagePinned pins or unpins a message in a space channel, so the
  // channel keeps it. Requires manage_channels in the channel's space;
  // every member reads the list. Setting the state it already has is a
  // no-op. Pinning into a channel that already holds the maximum is
  // refused. See docs/architecture/messaging.md.
  rpc SetMessagePinned(SetMessagePinnedRequest) returns (SetMessagePinnedResponse) {}
  // ListPinnedMessages returns a channel's pins, most recently pinned
  // first. Members only; no paging — a channel holds at most 50.
  rpc ListPinnedMessages(ListPinnedMessagesRequest) returns (ListPinnedMessagesResponse) {}
  // EditMessage replaces the content of the caller's own message.
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse) {}
  // DeleteMessage removes a message: the author's own, or anyone's with
  // messages.moderate. A root whose thread has replies is kept as a
  // placeholder (Message.deleted) instead.
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse) {}
  // DismissLinkPreview hides the card for one of a message's links, for
  // everyone: the author's own message, or anyone's with messages.moderate
  // (in a DM, only the author's). An edit keeps it hidden.
  rpc DismissLinkPreview(DismissLinkPreviewRequest) returns (DismissLinkPreviewResponse) {}
  // DeleteThread removes a root and every reply in its thread. Requires
  // messages.moderate in the channel's space.
  rpc DeleteThread(DeleteThreadRequest) returns (DeleteThreadResponse) {}
  // ToggleReaction adds the caller's reaction if absent and removes it if
  // present. Channel members only. Reactions never notify anyone and never
  // affect unread state.
  rpc ToggleReaction(ToggleReactionRequest) returns (ToggleReactionResponse) {}
  // ListActivity returns the caller's activity items, newest first,
  // with the current unread count.
  // MarkChannelRead moves the caller's read marker to the channel's newest
  // message (or to message_id if given). Members only.
  // Direct messages. A DM is a channel with no space; messages, read
  // markers and reactions use the channel RPCs above. Instance admins get
  // no RPC into other people's DMs.
  //
  // OpenDirectMessage returns the caller's conversation with one or more
  // other people, creating it if it does not exist. A conversation *is*
  // its participants, so this is idempotent for any number of them and
  // there is only ever one conversation with a given set. The caller must
  // share a space with each of them, unless they are an instance admin,
  // and a block in either direction between any two refuses the call.
  // Membership never changes afterwards: nobody can be added, and nobody
  // can leave.
  rpc OpenDirectMessage(OpenDirectMessageRequest) returns (OpenDirectMessageResponse) {}
  // The caller's DMs, most recent activity first.
  rpc ListDirectMessages(ListDirectMessagesRequest) returns (ListDirectMessagesResponse) {}
  // SetDirectMessageClosed takes a conversation off the caller's own list,
  // or puts it back. Nobody else's list changes, and the next message in
  // it puts it back for everyone. Closing is not leaving: membership never
  // changes, and getting away from a person is what blocking is for.
  rpc SetDirectMessageClosed(SetDirectMessageClosedRequest) returns (SetDirectMessageClosedResponse) {}
  // ListDirectMessageCandidates is everyone the caller may start a
  // conversation with: the people they share a space with, minus blocks in
  // either direction. Instance admins get the same list, not every account.
  rpc ListDirectMessageCandidates(ListDirectMessageCandidatesRequest) returns (ListDirectMessageCandidatesResponse) {}
  rpc MarkChannelRead(MarkChannelReadRequest) returns (MarkChannelReadResponse) {}
  // MarkThreadRead moves the caller's read marker in a thread to its
  // newest reply (or to reply_id if given). Only forward.
  rpc MarkThreadRead(MarkThreadReadRequest) returns (MarkThreadReadResponse) {}
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse) {}
  // MarkActivityRead marks the given activity items (or all of them)
  // read and returns the new unread count.
  rpc MarkActivityRead(MarkActivityReadRequest) returns (MarkActivityReadResponse) {}
}

message CreateSpaceRequest {
  string name = 1;
}

message CreateSpaceResponse {
  Space space = 1;
  // The auto-created #general channel.
  Channel default_channel = 2;
}

message ListSpacesRequest {
  // Every space on the server rather than the caller's own; needs
  // spaces.join_any, which instance admins hold. Unread and mute state
  // are not reported for spaces the caller isn't in.
  bool all = 1;
}

message ListSpacesResponse {
  repeated Space spaces = 1;
}

message ListAllSpacesRequest {}

message ListAllSpacesResponse {
  repeated SpaceSummary spaces = 1;
}

message GetSpaceRequest {
  string space_id = 1;
}

message GetSpaceResponse {
  Space space = 1;
}

message JoinSpaceRequest {
  // An invite code as shown in the app (surrounding whitespace is ignored).
  string code = 1;
  // Instance admins only: join a space directly, without an invite. When
  // set, code is ignored.
  string space_id = 2;
}

message JoinSpaceResponse {
  Space space = 1;
}

message GetMemberRequest {
  string space_id = 1;
  string user_id = 2;
}

message GetMemberResponse {
  Member member = 1;
}

message MarkChannelReadRequest {
  string channel_id = 1;
  // Optional: mark read up to this message instead of the newest.
  string message_id = 2;
}

message MarkChannelReadResponse {
  // The marker after the call.
  string last_read_message_id = 1;
}

message MarkThreadReadRequest {
  // The thread's root.
  string message_id = 1;
  // Optional: mark read up to this reply instead of the newest.
  string reply_id = 2;
}

message MarkThreadReadResponse {
  // The marker after the call.
  string last_read_message_id = 1;
}

message ListActivityRequest {
  // Return items strictly older than this ID. Empty means newest.
  string before_id = 1;
  // Max to return; server clamps to [1, 100]. 0 means default (50).
  int32 limit = 2;
}

message ListActivityResponse {
  repeated ActivityItem items = 1;
  int32 unread_count = 2;
}

message MarkActivityReadRequest {
  repeated string ids = 1;
  // When true, ids is ignored and everything is marked read.
  bool all = 2;
}

message MarkActivityReadResponse {
  int32 unread_count = 1;
}

message ListMembersRequest {
  string space_id = 1;
}

message ListMembersResponse {
  // Owner first, then admins, then members; each group by join time.
  repeated Member members = 1;
}

message SetMemberRoleRequest {
  string space_id = 1;
  string user_id = 2;
  SpaceRole role = 3;
}

message SetMemberRoleResponse {
  Member member = 1;
}

message KickMemberRequest {
  string space_id = 1;
  string user_id = 2;
}

message KickMemberResponse {}

message AddMemberRequest {
  string space_id = 1;
  string user_id = 2;
}

message AddMemberResponse {
  Space space = 1;
}

message BanMemberRequest {
  string space_id = 1;
  string user_id = 2;
  // Shown to admins in the ban list; never to the banned person.
  string reason = 3;
}

message BanMemberResponse {}

message UnbanMemberRequest {
  string space_id = 1;
  string user_id = 2;
}

message UnbanMemberResponse {}

message ListBansRequest {
  string space_id = 1;
}

// Ban is one entry in a space's ban list.
message Ban {
  MessageAuthor user = 1;
  string reason = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListBansResponse {
  repeated Ban bans = 1;
}

message ListGroupsRequest {
  string space_id = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message CreateGroupRequest {
  string space_id = 1;
  string handle = 2;
  string name = 3;
  repeated string user_ids = 4;
}

message CreateGroupResponse {
  Group group = 1;
}

message UpdateGroupRequest {
  string group_id = 1;
  string handle = 2;
  string name = 3;
  repeated string user_ids = 4;
}

message UpdateGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string group_id = 1;
}

message DeleteGroupResponse {}

message BlockUserRequest {
  string user_id = 1;
}

message BlockUserResponse {}

message UnblockUserRequest {
  string user_id = 1;
}

message UnblockUserResponse {}

message ListBlockedUsersRequest {}

message ListBlockedUsersResponse {
  repeated MessageAuthor users = 1;
}

message LeaveSpaceRequest {
  string space_id = 1;
}

message LeaveSpaceResponse {}

message TransferOwnershipRequest {
  string space_id = 1;
  string user_id = 2;
}

message TransferOwnershipResponse {
  Space space = 1;
}

message UpdateSpaceRequest {
  string space_id = 1;
  // Unset fields are left unchanged; an empty string clears one.
  optional string name = 2;
  optional bool members_can_invite = 3;
  optional string description = 4;
  optional string welcome = 5;
  // A text channel in this space, or empty to go back to whichever
  // channel sorts first.
  optional string default_channel_id = 6;
  // Turning it off ends the space's calls and hides its voice channels;
  // nothing is deleted.
  optional bool voice_enabled = 7;
}

message UpdateSpaceResponse {
  Space space = 1;
}

message DeleteSpaceRequest {
  string space_id = 1;
}

message DeleteSpaceResponse {}

message CreateInviteRequest {
  string space_id = 1;
  // How long the invite stays valid. Unset means it never expires.
  google.protobuf.Duration expires_in = 2;
  // Maximum number of joins. Unset means unlimited.
  optional int32 max_uses = 3;
  // Role granted on join: MEMBER (default) or ADMIN. Must not exceed the
  // caller's own role; OWNER is rejected.
  SpaceRole role = 4;
}

message CreateInviteResponse {
  Invite invite = 1;
}

message ListInvitesRequest {
  string space_id = 1;
}

message ListInvitesResponse {
  // Ordered newest → oldest.
  repeated Invite invites = 1;
}

message RevokeInviteRequest {
  string invite_id = 1;
}

message RevokeInviteResponse {
  Invite invite = 1;
}

message LookupInviteRequest {
  // The share link's last segment.
  string code = 1;
}

message LookupInviteResponse {
  InvitePreview preview = 1;
}

message CreateChannelRequest {
  string space_id = 1;
  string name = 2;
  ChannelKind kind = 3;
  // Only the people added to it can see it. Not for a direct message.
  bool private = 4;
}

message CreateChannelResponse {
  Channel channel = 1;
}

message SetChannelMutedRequest {
  string channel_id = 1;
  bool muted = 2;
}

message SetChannelMutedResponse {
  Channel channel = 1;
}

message SetSpaceMutedRequest {
  string space_id = 1;
  bool muted = 2;
}

message SetSpaceMutedResponse {
  Space space = 1;
}

message SetThreadMutedRequest {
  // The thread's root.
  string message_id = 1;
  bool muted = 2;
}

message SetThreadMutedResponse {}

message ListThreadMutesRequest {}

message ListThreadMutesResponse {
  repeated MutedThread threads = 1;
}

// MutedThread is one row of Profile → Muted.
message MutedThread {
  // Empty for a direct message.
  string space_id = 1;
  string channel_id = 2;
  // The root, for its author and an excerpt (a placeholder when deleted).
  Message root = 3;
}

message ListChannelsRequest {
  string space_id = 1;
}

message ListAllChannelsRequest {
  string space_id = 1;
}

message ListAllChannelsResponse {
  repeated ManagedChannel channels = 1;
}

// ManagedChannel is a channel as Space settings lists it.
message ManagedChannel {
  Channel channel = 1;
  // People in a private channel; 0 for a public one, which everyone in
  // the space is in.
  int32 member_count = 2;
  // Whether the caller is in it. Always true for a public channel.
  bool joined = 3;
}

message ListChannelMembersRequest {
  string channel_id = 1;
}

message ListChannelMembersResponse {
  // In the order they were added. Resolve against ListMembers.
  repeated string user_ids = 1;
}

message AddChannelMembersRequest {
  string channel_id = 1;
  repeated string user_ids = 2;
}

message AddChannelMembersResponse {}

message RemoveChannelMemberRequest {
  string channel_id = 1;
  string user_id = 2;
}

message RemoveChannelMemberResponse {}

message LeaveChannelRequest {
  string channel_id = 1;
}

message LeaveChannelResponse {}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message UpdateChannelRequest {
  string channel_id = 1;
  optional string name = 2;
  // Unset leaves the topic alone; empty clears it.
  optional string topic = 3;
  // Text channels only; UNSPECIFIED is refused.
  optional ChannelPostPolicy post_policy = 4;
}

message UpdateChannelResponse {
  Channel channel = 1;
}

message DeleteChannelRequest {
  string channel_id = 1;
}

message DeleteChannelResponse {}

message ReorderChannelsRequest {
  string space_id = 1;
  // Every channel of the space, in the desired order.
  repeated string channel_ids = 2;
}

message ReorderChannelsResponse {
  repeated Channel channels = 1;
}

message SendMessageRequest {
  string channel_id = 1;
  string content = 2;
  // Optional: the message this replies to; must be in the same channel.
  string reply_to_message_id = 3;
  // Files uploaded via POST /files/upload by the caller for this channel's
  // space, at most 10, each usable by one message. content may be empty
  // when attachments are present.
  repeated string attachment_ids = 4;
  // Optional: post into this root's thread instead of the channel. The root
  // must be a top-level message in the same channel, not a placeholder;
  // refused in an announcement channel.
  string thread_root_id = 5;
  // With thread_root_id: the reply shows in the channel's timeline as well
  // as in the thread (Message.in_channel), one message in both places.
  bool also_send_to_channel = 6;
}

message SendMessageResponse {
  Message message = 1;
}

message EditMessageRequest {
  string message_id = 1;
  string content = 2;
}

message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string message_id = 1;
}

message DeleteMessageResponse {}

message DismissLinkPreviewRequest {
  string message_id = 1;
  // The card's URL, as LinkPreview.url gives it.
  string url = 2;
}

message DismissLinkPreviewResponse {}

message DeleteThreadRequest {
  // The thread's root.
  string message_id = 1;
}

message DeleteThreadResponse {}

message ToggleReactionRequest {
  string message_id = 1;
  // A single emoji (one grapheme cluster, at most 16 bytes).
  string emoji = 2;
}

message ToggleReactionResponse {
  // The message with its reactions after the toggle.
  Message message = 1;
}

message ListMessagesRequest {
  string channel_id = 1;
  // Return messages strictly older than this message ID (UUIDv7, so IDs are
  // time-ordered). Empty means "newest".
  string before_id = 2;
  // Max messages to return; server clamps to [1, 100]. 0 means default (50).
  int32 limit = 3;
  // Return messages strictly newer than this message ID (the oldest `limit`
  // of them). Mutually exclusive with before_id and around_id.
  string after_id = 4;
  // Return a window centred on this message, which is included; NotFound if
  // it is not in the channel. Mutually exclusive with before_id and after_id.
  // A reply that shows only in its thread centres the window on its root
  // instead, and thread_root_id in the response names the thread.
  string around_id = 5;
  // Page this root's thread instead of the channel; the root itself is not
  // included. The same paging parameters apply.
  string thread_id = 6;
}

message ListMessagesResponse {
  // Ordered oldest → newest.
  repeated Message messages = 1;
  // Whether the channel (may) have messages older than the first returned.
  bool has_older = 2;
  // Whether the channel (may) have messages newer than the last returned.
  // False for the newest page, which is the page realtime events extend.
  bool has_newer = 3;
  // Set when around_id was a reply that shows only in its thread: the
  // thread to open on it.
  string thread_root_id = 4;
  // The channel's seq, read before the page was: anything that commits
  // after it has a higher seq and reaches the client as a change. A row
  // in the page with a higher seq is newer still and is kept.
  int64 channel_seq = 5;
  // The message id below which the retention sweep removes top-level
  // messages, as of this answer; empty when retention is off. A client
  // drops any held row whose id, or whose thread root's id, is below it.
  string retention_floor_id = 6;
}

message ListChangesRequest {
  string channel_id = 1;
  // Rows with a seq above this come back. 0 asks for the whole log.
  int64 since_seq = 2;
  // Max rows to return; server clamps to [1, 200]. 0 means default (100).
  int32 limit = 3;
}

// A client holding a seq asks for everything after it, applies each row by
// "higher seq wins", drops any held row whose id, or whose thread root's
// id, is below retention_floor_id, and repeats while has_more.
message ListChangesResponse {
  // Ordered by seq, ascending. A row is in the channel log once, at its
  // latest position. A tombstone comes back as a Message with deleted set,
  // no content and nothing attached; a thread reply has in_channel false
  // and its thread_root_id.
  repeated Message messages = 1;
  // The channel's seq, read before the rows were: anything that commits
  // after it has a higher seq and reaches the client as a change.
  int64 channel_seq = 2;
  // True when the page was full: ask again from the last row's seq.
  bool has_more = 3;
  // As ListMessagesResponse.retention_floor_id.
  string retention_floor_id = 4;
}

message SearchMessagesRequest {
  // What to search. A oneof so a direct-message scope can be added as a
  // second case later.
  oneof scope {
    // Every channel in the space; the caller must be a member.
    string space_id = 1;
  }
  // Words, "quoted phrases", -excluded words and OR, plus the filters
  // from:@handle, in:#channel, before:YYYY-MM-DD and after:YYYY-MM-DD.
  // The last bare word matches as a prefix once it is three characters.
  // At most 200 characters; something searchable must remain after the
  // filters are taken out.
  string query = 3;
  // Return matches strictly older than this message ID. Empty means the
  // newest matches.
  string before_id = 4;
  // Max matches to return; server clamps to [1, 50]. 0 means default (25).
  int32 limit = 5;
}

message SearchMessagesResponse {
  // Ordered newest → oldest.
  repeated Message messages = 1;
  // Whether there (may) be older matches than the last returned.
  bool has_older = 2;
}

message SetMessagePinnedRequest {
  string message_id = 1;
  // True pins, false unpins.
  bool pinned = 2;
}

message SetMessagePinnedResponse {
  // The pin after the call; unset after an unpin.
  PinnedMessage pin = 1;
}

message ListPinnedMessagesRequest {
  string channel_id = 1;
}

message ListPinnedMessagesResponse {
  // Ordered most recently pinned first.
  repeated PinnedMessage pins = 1;
}

// DirectMessage is a DM channel with the people in it. More than two
// participants is a group conversation; it has no name of its own, so
// clients render one from the participants. The list never changes, so
// counting it is a reliable test.
message DirectMessage {
  Channel channel = 1;
  // The caller took it off their list; it comes back with the next
  // message. Still listed here so a link to it still resolves.
  bool closed = 3;
  // Everyone in the conversation, the caller included.
  repeated MessageAuthor participants = 2;
}

message OpenDirectMessageRequest {
  // Was `string user_id`, before a conversation could hold more than two.
  reserved 1;
  reserved "user_id";
  // Everyone else in the conversation, without the caller: 1 to 9 of them.
  repeated string user_ids = 2;
}

message OpenDirectMessageResponse {
  DirectMessage direct_message = 1;
}

message ListDirectMessagesRequest {}

message ListDirectMessagesResponse {
  repeated DirectMessage direct_messages = 1;
}

message SetDirectMessageClosedRequest {
  string channel_id = 1;
  bool closed = 2;
}

message SetDirectMessageClosedResponse {
  DirectMessage direct_message = 1;
}

message ListDirectMessageCandidatesRequest {}

message ListDirectMessageCandidatesResponse {
  repeated MessageAuthor users = 1;
}
