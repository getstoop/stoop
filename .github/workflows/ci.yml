name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, e.g. `gh workflow run CI` — added when a GitHub Actions
  # outage swallowed push events and there was no way to re-run main.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR cancels the run still going for the old
# head — its result would never be looked at. Runs on main are never
# cancelled: each merge gets its own verdict, and a cancelled one would
# look like a red main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen web/src/gen

  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoop
          POSTGRES_PASSWORD: stoop
          POSTGRES_DB: stoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Check sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/dbgen
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
      - name: Test
        run: go test ./...
        env:
          STOOP_TEST_DATABASE_URL: postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable

  # The browser suite is the long pole of CI, so it is split: one job
  # builds the binary, four run balanced slices of the spec list against
  # their own server and database, and a last job with the old name rolls
  # their results up. The branch ruleset requires "Browser E2E" and never
  # needs to know how many shards there are.
  e2e-build:
    name: Build for browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build binary with embedded web app
        run: make build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stoop-e2e-binary
          path: bin/stoop
          retention-days: 1

  e2e-shard:
    name: Browser E2E shard ${{ matrix.shard }}
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoop
          POSTGRES_PASSWORD: stoop
          POSTGRES_DB: stoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install spec dependencies
        run: cd web && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stoop-e2e-binary
          path: bin
      - name: Start server
        run: |
          chmod +x bin/stoop
          STOOP_DATABASE_URL=postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable \
          STOOP_LISTEN_ADDR=:8091 STOOP_UNFURL_ALLOW_PRIVATE=1 ./bin/stoop > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8091/healthz && break; sleep 1; done
      - name: Run browser suite (shard ${{ matrix.shard }} of 4)
        run: cd web && pnpm e2e --shard ${{ matrix.shard }}/4
        env:
          STOOP_E2E_DATABASE_URL: postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable
          STOOP_E2E_CHROME: /usr/bin/google-chrome
      - name: Server log
        if: failure()
        run: cat server.log

  e2e:
    name: Browser E2E
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          test "${{ needs.e2e-shard.result }}" = success || {
            echo "shards finished with: ${{ needs.e2e-shard.result }}"
            exit 1
          }

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  build:
    name: Cross-compile (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Keeps the "runs on a Raspberry Pi" promise honest on every PR.
      - name: Build linux/${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build ./cmd/stoop
