name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, e.g. `gh workflow run CI` — added when a GitHub Actions
  # outage swallowed push events and there was no way to re-run main.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR cancels the run still going for the old
# head — its result would never be looked at. Runs on main are never
# cancelled: each merge gets its own verdict, and a cancelled one would
# look like a red main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A change that touches only documentation skips the build and test
  # jobs: they are marked skipped, which the branch ruleset counts as
  # passing, so a README fix does not run four browser shards. Anything
  # outside docs/, *.md, LICENSE and the issue/PR templates is code, and
  # so is a manual run or a push whose base is unknown.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF"; range="$base...HEAD" ;;
            push) base="$BEFORE"; range="$base..HEAD" ;;
            *) base=""; range="" ;;
          esac
          if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$range")
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|LICENSE$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CODEOWNERS$)|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  proto:
    name: Protobuf
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen web/src/gen

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoop
          POSTGRES_PASSWORD: stoop
          POSTGRES_DB: stoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/dbgen
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: Test
        run: go test ./...
        env:
          STOOP_TEST_DATABASE_URL: postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable

  # The browser suite is the long pole of CI, so it is split: one job
  # builds the binary, four run balanced slices of the spec list against
  # their own server and database, and a last job with the old name rolls
  # their results up. The branch ruleset requires "Browser E2E" and never
  # needs to know how many shards there are.
  e2e-build:
    name: Build for browser E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build binary with embedded web app
        run: make build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stoop-e2e-binary
          path: bin/stoop
          retention-days: 1

  e2e-shard:
    name: Browser E2E shard ${{ matrix.shard }}
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoop
          POSTGRES_PASSWORD: stoop
          POSTGRES_DB: stoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install spec dependencies
        run: cd web && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stoop-e2e-binary
          path: bin
      - name: Start server
        run: |
          chmod +x bin/stoop
          STOOP_DATABASE_URL=postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable \
          STOOP_LISTEN_ADDR=:8091 STOOP_UNFURL_ALLOW_PRIVATE=1 ./bin/stoop > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8091/healthz && break; sleep 1; done
      - name: Run browser suite (shard ${{ matrix.shard }} of 4)
        run: cd web && pnpm e2e --shard ${{ matrix.shard }}/4
        env:
          STOOP_E2E_DATABASE_URL: postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable
          STOOP_E2E_CHROME: /usr/bin/google-chrome
      - name: Server log
        if: failure()
        run: cat server.log

  e2e:
    name: Browser E2E
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$SHARDS" = success ] || { [ "$SHARDS" = skipped ] && [ "$CODE" != true ]; }; then
            exit 0
          fi
          echo "shards finished with: $SHARDS"
          exit 1

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  build:
    name: Cross-compile (${{ matrix.goarch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Keeps the "runs on a Raspberry Pi" promise honest on every PR.
      - name: Build linux/${{ matrix.goarch }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build ./cmd/stoop
