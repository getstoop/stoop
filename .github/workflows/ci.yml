name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, e.g. `gh workflow run CI` — added when a GitHub Actions
  # outage swallowed push events and there was no way to re-run main.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR cancels the run still going for the old
# head — its result would never be looked at. Runs on main are never
# cancelled: each merge gets its own verdict, and a cancelled one would
# look like a red main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A change that touches only documentation skips the build and test
  # jobs: they are marked skipped, which the branch ruleset counts as
  # passing, so a README fix does not run the browser suite. Anything
  # outside docs/, *.md, LICENSE and the issue/PR templates is code, and
  # so is a manual run or a push whose base is unknown.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF"; range="$base...HEAD" ;;
            push) base="$BEFORE"; range="$base..HEAD" ;;
            *) base=""; range="" ;;
          esac
          if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$range")
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|LICENSE$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CODEOWNERS$)|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  proto:
    name: Protobuf
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          setup_only: true
      - name: Lint
        run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- gen web/src/gen

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoop
          POSTGRES_PASSWORD: stoop
          POSTGRES_DB: stoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- internal/dbgen
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - name: Test
        run: go test ./...
        env:
          STOOP_TEST_DATABASE_URL: postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable

  # The browser suite is the long pole of CI, so it is split: one job
  # builds the binary, one runs the specs against its own server and
  # database, and a last job with the old name rolls the result up. The
  # branch ruleset requires "Browser E2E" and never needs to know how the
  # work below it is divided.
  #
  # It ran as four shards until the Playwright migration (STOOP-238) left
  # attachments as the only puppeteer spec: three of the four then spent
  # ~35 s apiece on checkout, install and a server start to run nothing,
  # and Actions bills every started job a whole minute. Shard again when
  # there is enough work to need it — Playwright has --shard of its own.
  e2e-build:
    name: Build for browser E2E
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build binary with embedded web app
        run: make build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stoop-e2e-binary
          path: bin/stoop
          retention-days: 1

  e2e-run:
    name: Browser E2E run
    needs: e2e-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stoop
          POSTGRES_PASSWORD: stoop
          POSTGRES_DB: stoop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stoop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install spec dependencies
        run: cd web && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stoop-e2e-binary
          path: bin
      # One key pair for both sides. The server prefers
      # STOOP_LIVEKIT_API_KEY/_SECRET over the pair it would otherwise mint
      # (internal/app/app.go, livekitKeys), so neither process has to start
      # first — unlike dev and self-hosting, where the server mints the pair
      # and LiveKit reads the file it writes.
      - name: Mint a LiveKit key pair
        run: |
          secret=$(openssl rand -base64 36 | tr -d '\n=+/' | cut -c1-43)
          # Masked before export, or every later step prints it in its own
          # env block. LiveKit wants at least 32 characters.
          echo "::add-mask::$secret"
          echo "LK_KEY=APIci$(openssl rand -hex 6)" >> "$GITHUB_ENV"
          echo "LK_SECRET=$secret" >> "$GITHUB_ENV"

      # Host networking, not a service container: browsers hide their local
      # IPs behind mDNS names, which nothing on a Docker bridge network can
      # resolve, so a bridged LiveKit never gets media from a local browser.
      # See docs/architecture/voice.md.
      - name: Start LiveKit
        run: |
          printf '%s: %s\n' "$LK_KEY" "$LK_SECRET" > /tmp/livekit-keys.yaml
          # LiveKit refuses a key file anyone else can read.
          chmod 600 /tmp/livekit-keys.yaml
          docker run -d --name livekit --network host \
            -v /tmp/livekit-keys.yaml:/keys.yaml:ro \
            -v "$PWD/deploy/livekit.dev.yaml:/etc/livekit.yaml:ro" \
            livekit/livekit-server:v1.13.6 \
            --config /etc/livekit.yaml --key-file /keys.yaml
          # Fail here rather than let the voice spec report the consequence
          # forty seconds later as "Couldn't join voice".
          for i in $(seq 1 30); do
            curl -sf localhost:7880 >/dev/null 2>&1 && exit 0
            docker inspect -f '{{.State.Running}}' livekit | grep -q true || break
            sleep 1
          done
          echo "LiveKit did not come up on :7880" >&2
          docker logs livekit >&2
          exit 1

      - name: Start server
        run: |
          chmod +x bin/stoop
          STOOP_DATABASE_URL=postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable \
          STOOP_LISTEN_ADDR=:8091 STOOP_UNFURL_ALLOW_PRIVATE=1 \
          STOOP_AUTH_RATE_LIMIT=0 \
          STOOP_LIVEKIT_URL=http://localhost:7880 \
          STOOP_LIVEKIT_API_KEY="$LK_KEY" STOOP_LIVEKIT_API_SECRET="$LK_SECRET" \
          ./bin/stoop > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8091/healthz && break; sleep 1; done
      - name: Install Playwright browser
        run: cd web && npx playwright install chromium
      - name: Run the browser suite
        run: cd web && npx playwright test
        env:
          STOOP_E2E_DATABASE_URL: postgres://stoop:stoop@localhost:5432/stoop?sslmode=disable
      - name: Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure
          path: web/test-results
          retention-days: 3
      - name: Server log
        if: failure()
        run: cat server.log
      - name: LiveKit log
        if: failure()
        run: docker logs livekit

  e2e:
    name: Browser E2E
    needs: [changes, e2e-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The run passed
        env:
          RESULT: ${{ needs.e2e-run.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$RESULT" = success ] || { [ "$RESULT" = skipped ] && [ "$CODE" != true ]; }; then
            exit 0
          fi
          echo "the browser run finished with: $RESULT"
          exit 1

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Skipped per step rather than per job: a matrix job skipped at job
  # level never expands its matrix, so the required checks named
  # "Cross-compile (amd64)" and "(arm64)" would never appear and a
  # docs-only PR would wait on them forever.
  build:
    name: Cross-compile (${{ matrix.goarch }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
      # Keeps the "runs on a Raspberry Pi" promise honest on every PR.
      - name: Build linux/${{ matrix.goarch }}
        if: needs.changes.outputs.code == 'true'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build ./cmd/stoop
