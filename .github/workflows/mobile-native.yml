name: Mobile native build

# Compiles the phone app's native code, Kotlin for Android and Swift for
# iOS, including our own module (mobile/modules/stoop-rich-text). Run by
# hand, not on every pull request: the iOS job needs a macOS runner.
#
#   gh workflow run mobile-native.yml -f branch=<branch>
#
# or Actions → Mobile native build → Run workflow. Both jobs are debug
# builds, which skip bundling the JavaScript; nothing is signed or kept.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag or commit to build
        type: string
        required: true
        default: main

permissions:
  contents: read

# No caches: the run checks out whatever branch it is given, and a cache it
# saved would be read by builds of main. Every run starts cold.

# A second run for the same branch replaces the first.
concurrency:
  group: mobile-native-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  android:
    name: Android compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --clean
      # The runner's SDK is used as is; Gradle fetches the NDK and platform
      # the project names if the image lacks them. One ABI is enough to
      # prove the C++ compiles and keeps the job short.
      - name: Assemble debug
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

  ios:
    name: iOS compile
    # A standard hosted label only: larger macOS runners are billed even
    # on public repositories.
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Prebuild runs pod install.
      - run: pnpm exec expo prebuild --platform ios --clean
      # Debug skips bundling the JavaScript (the project's bundle phase
      # sets SKIP_BUNDLING for Debug), and RCT_NO_LAUNCH_PACKAGER keeps
      # Metro from starting.
      - name: Build for the simulator
        working-directory: mobile/ios
        env:
          RCT_NO_LAUNCH_PACKAGER: '1'
        run: |
          xcodebuild -workspace Stoop.xcworkspace -scheme Stoop \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build
