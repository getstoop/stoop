name: Release publish

# The last step of a release: publishing the draft that Release build
# left is the release. GitHub makes the tag on the commit that was built
# and marks the release latest; this moves the image's `latest` to match.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-publish

jobs:
  latest:
    name: Move latest to the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, to know this release is the newest.
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Fails, and moves nothing, when the release has no image of its
      # own: one published by hand, not from a Release build draft.
      - name: Point latest at the release's image
        run: |
          fail() { echo "::error::$1"; exit 1; }
          release='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$TAG" =~ $release ]] || fail "$TAG is not a release tag."
          newest=$(git tag --list 'v*' | grep -E "$release" | sort -V | tail -n 1 || true)
          [ "$TAG" = "$newest" ] || fail "$TAG is not the newest release ($newest); latest stays where it is."
          image=ghcr.io/getstoop/stoop
          docker buildx imagetools create --tag "$image:latest" "$image:${TAG#v}"
