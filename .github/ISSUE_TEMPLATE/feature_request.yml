name: Feature request
description: Something Stoop should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where Stoop gets in the way. Lead with the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: If you have a shape in mind. It's fine to leave this blank.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
