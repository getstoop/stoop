<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Stoop</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141517" />
    <script>
      // Stamp the saved theme before anything paints (see src/api/theme.ts
      // for the full logic; this must stay in step with it). Inside the
      // desktop shell the theme is the shell's, whole, on
      // window.stoop.theme: its tokens go on the root as they are, and
      // none of ours is stamped.
      (function () {
        var ids = ["brownstone", "daylight", "dusk", "bodega", "newsprint", "blackout", "fire-escape", "nightcap", "night-bus", "mailbox"];
        var shell = window.stoop && window.stoop.theme;
        if (shell && typeof shell === "object") {
          var tokens = shell.tokens || {};
          for (var name in tokens) {
            if (name.indexOf("--") === 0 && typeof tokens[name] === "string")
              document.documentElement.style.setProperty(name, tokens[name]);
          }
          if (shell.scheme === "light" || shell.scheme === "dark")
            document.documentElement.style.colorScheme = shell.scheme;
          return;
        }
        var theme = "brownstone";
        try {
          var p = JSON.parse(localStorage.getItem("stoop.theme") || "null");
          if (p) {
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var pick = p.mode === "system" ? (dark ? p.dark : p.light) : p.theme;
            if (ids.indexOf(pick) !== -1) theme = pick;
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
