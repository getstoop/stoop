version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/getstoop/stoop/gen
# The plugin versions are pinned. Unpinned, buf resolves whatever is
# current, so the day one of them publishes a release, CI regenerates a
# tree that differs from the committed one — often by nothing but the
# "@generated by ... vX.Y.Z" header — and the "generated code is up to
# date" job fails on whichever commit happens to land next. Pinned, a
# generator upgrade is a commit someone made on purpose: bump the
# version here, run `make generate`, and the diff is reviewable.
plugins:
  # Go protobuf messages
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  # Go Connect services
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen
    opt: paths=source_relative
  # TypeScript messages + service descriptors (connect-es v2 consumes these directly)
  - remote: buf.build/bufbuild/es:v2.14.1
    out: web/src/gen
    opt: target=ts
